apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-network-quality
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  network-quality.json: |
    {
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.99 },
                  { "color": "green", "value": 0.995 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "avg(avg_over_time(probe_success{target=~\"$target\", probe_type=~\"$probe_type\"}[$__range]))",
              "legendFormat": "success",
              "refId": "A"
            }
          ],
          "title": "Overall Success Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.99 },
                  { "color": "green", "value": 0.995 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "avg(avg_over_time(probe_success{target=~\"$target\", probe_type=\"icmp\"}[$__range]))",
              "legendFormat": "icmp",
              "refId": "A"
            }
          ],
          "title": "ICMP Success Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "quantile(0.95, quantile_over_time(0.95, probe_duration_seconds{target=~\"$target\", probe_type=~\"$probe_type\"}[$__range]))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "p95 Probe Duration",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "count(probe_success{target=~\"$target\", probe_type=~\"$probe_type\"} == 0) or vector(0)",
              "legendFormat": "failures",
              "refId": "A"
            }
          ],
          "title": "Current Failures",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10, "showPoints": "never" },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.99 },
                  { "color": "green", "value": 0.995 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 5,
          "options": {
            "legend": { "calcs": [ "lastNotNull", "mean" ], "displayMode": "table" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "probe_success{target=~\"$target\", probe_type=~\"$probe_type\"}",
              "legendFormat": "{{target}} {{probe_type}}",
              "refId": "A"
            }
          ],
          "title": "Probe Success",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10, "showPoints": "never" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 6,
          "options": {
            "legend": { "calcs": [ "lastNotNull", "mean" ], "displayMode": "table" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "probe_duration_seconds{target=~\"$target\", probe_type=~\"$probe_type\"}",
              "legendFormat": "{{target}} {{probe_type}}",
              "refId": "A"
            }
          ],
          "title": "Probe Duration",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "id": 7,
          "options": {
            "legend": { "calcs": [ "lastNotNull", "mean" ], "displayMode": "table" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "probe_http_duration_seconds{target=~\"$target\", phase=~\"resolve|connect|tls|processing|transfer\"}",
              "legendFormat": "{{target}} {{phase}}",
              "refId": "A"
            }
          ],
          "title": "HTTP Phase Duration",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "id": 8,
          "options": {
            "legend": { "calcs": [ "lastNotNull", "max" ], "displayMode": "table" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "1 - avg_over_time(probe_success{target=~\"$target\", probe_type=\"icmp\"}[5m])",
              "legendFormat": "{{target}} 5m loss",
              "refId": "A"
            }
          ],
          "title": "ICMP Failure Rate (5m)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.99 },
                  { "color": "green", "value": 0.995 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "id": 9,
          "options": {
            "orientation": "horizontal"
          },
          "targets": [
            {
              "expr": "avg by (target, probe_type) (avg_over_time(probe_success{target=~\"$target\", probe_type=~\"$probe_type\"}[$__range]))",
              "legendFormat": "{{target}} {{probe_type}}",
              "refId": "A"
            }
          ],
          "title": "Success Rate by Target",
          "type": "bargauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 21 },
          "id": 10,
          "options": {
            "orientation": "horizontal"
          },
          "targets": [
            {
              "expr": "quantile_over_time(0.95, probe_duration_seconds{target=~\"$target\", probe_type=~\"$probe_type\"}[$__range])",
              "legendFormat": "{{target}} {{probe_type}}",
              "refId": "A"
            }
          ],
          "title": "p95 Duration by Target",
          "type": "bargauge"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [ "network", "blackbox", "quality" ],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(probe_success{probe_type=~\".+\"}, target)",
            "includeAll": true,
            "label": "Target",
            "multi": true,
            "name": "target",
            "query": {
              "query": "label_values(probe_success{probe_type=~\".+\"}, target)",
              "refId": "StandardVariableQuery"
            },
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(probe_success{probe_type=~\".+\"}, probe_type)",
            "includeAll": true,
            "label": "Probe type",
            "multi": true,
            "name": "probe_type",
            "query": {
              "query": "label_values(probe_success{probe_type=~\".+\"}, probe_type)",
              "refId": "StandardVariableQuery"
            },
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-24h", "to": "now" },
      "timezone": "browser",
      "title": "Network Quality",
      "uid": "network-quality"
    }
